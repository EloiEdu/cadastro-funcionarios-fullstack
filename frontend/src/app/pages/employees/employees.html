<div class = 'container'>

  <h1>Funcionários</h1>
  <p>Total de funcionários: {{ employees().length }}</p>
    <div class="toolbar">

      <button
          class="new-btn"
          routerLink="/employees/new">

          + Novo Funcionário

      </button>

    </div>

    <table>

      <thead>
      
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>Cargo</th>
          <th>Salário</th>
          <th>Ações</th>
        </tr>

      </thead>

      <tbody>
        

        @for (employee of employees(); track employee.id) {

          <tr>

          
            <td>{{ employee.name }}</td>
            <td>{{ employee.email }}</td>
            <td>{{ employee.role }}</td>
            <td>R$ {{ employee.salary }}</td>
            
              <td class="actions">

              <button
                class="edit-btn"
                [routerLink]="['/employees/edit', employee.id]">
                Editar
              </button>

              @if (isAdmin){
              
              <button
                class="delete-btn"
                (click)="deleteEmployee(employee.id)">
                Excluir
              </button>
              
              }

          </tr>

        }
      </tbody>
    </table>
</div>
